services:
  api:
    build:
      context: ./api
    ports:
      - "8000:8000"
    volumes:
      - ./api:/var/www/html
      - api-vendor:/var/www/html/vendor
    depends_on:
      db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      - qor

  admin:
    build:
      context: ./admin
    ports:
      - "3001:3000"
    environment:
      # "" (same-origin) is the default, not an absolute http://localhost:8000
      # or http://api:8000: the browser — whether a developer's host Chrome
      # hitting this container's published port, or Playwright's bundled
      # Chromium running inside this container for `make e2e-admin` — must
      # call its own origin so Sanctum's session cookie (api/.env's
      # SESSION_DOMAIN=null, so no explicit cookie Domain) is always
      # same-origin, never cross-site. next.config.ts's rewrites proxy the
      # relative request server-side to the api container over the Docker
      # network. See ARCHITECTURE §8.1/§8.3.
      NEXT_PUBLIC_API_BASE_URL: ${ADMIN_API_BASE_URL-}
      API_PROXY_TARGET: http://api:8000
    volumes:
      - ./admin:/app
      - admin-node-modules:/app/node_modules
      - admin-next-cache:/app/.next
    depends_on:
      - api
    networks:
      - qor

  website:
    build:
      context: ./website
    ports:
      - "3002:3000"
    environment:
      # Same same-origin rationale as admin's own NEXT_PUBLIC_API_BASE_URL —
      # see that service's comment above.
      NEXT_PUBLIC_API_BASE_URL: ${WEBSITE_API_BASE_URL-}
      API_PROXY_TARGET: http://api:8000
      # Event detail page's Google Maps JS API embed (W17) — set in your own
      # local .env (gitignored, never committed), not here.
      NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY-}
    volumes:
      - ./website:/app
      - website-node-modules:/app/node_modules
      - website-next-cache:/app/.next
    depends_on:
      - api
    networks:
      - qor

  # Playwright suite for admin — built from admin/Dockerfile.e2e (has its
  # own Chromium+deps install), gated behind the "e2e" profile so `make up`
  # never builds or starts it. Shares the admin service's network
  # namespace (rather than joining the qor network under its own hostname)
  # so the browser sees localhost:3000, exactly like before this split —
  # Next dev's same-origin check and Sanctum's stateful-domain check both
  # only trust localhost by default. See admin/playwright.config.ts.
  admin-e2e:
    build:
      context: ./admin
      dockerfile: Dockerfile.e2e
    depends_on:
      - admin
    network_mode: "service:admin"
    profiles: ["e2e"]

  # Playwright suite for website — same rationale as admin-e2e above.
  website-e2e:
    build:
      context: ./website
      dockerfile: Dockerfile.e2e
    depends_on:
      - website
    network_mode: "service:website"
    profiles: ["e2e"]

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-qor}
      POSTGRES_USER: ${POSTGRES_USER:-qor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qor}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-qor}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - qor

  # S3-compatible object store for local dev only (ARCHITECTURE.md §10, §21) —
  # production uses real S3, never MinIO.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-qor}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-qor12345}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - qor

  # One-shot: creates and publicizes the media bucket, then exits.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-qor} ${MINIO_ROOT_PASSWORD:-qor12345} &&
      mc mb --ignore-existing local/${AWS_BUCKET:-qor-media} &&
      mc anonymous set public local/${AWS_BUCKET:-qor-media}
      "
    networks:
      - qor

volumes:
  db-data:
  api-vendor:
  minio-data:
  admin-node-modules:
  admin-next-cache:
  website-node-modules:
  website-next-cache:

networks:
  qor:
    driver: bridge
